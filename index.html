<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <script src="app.js" defer></script>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    
    <form id="calculadora" novalidate>

        <label for="numero1">Primer Número: </label>
        <input type="number" id="numero1" name="numero1" step="any">
        <br><br>

        <label for="numero2">Segundo Número: </label>
        <input type="number" id="numero2" name="numero2" step="any">
        <br><br>


        <label for="operaciones">Selecciona la operacion</label>
        <select name="operaciones" id="operaciones">
            <option value="sumar">Sumar</option>
            <option value="restar">Restar</option>
            <option value="multiplicar">Multiplicar</option>
            <option value="dividir">Dividir</option>
            <option value="elevar">Elevar</option>
            <option value="resto">Resto</option>
        </select>

        <button id="calcular" type="submit">Calcular</button>
        <br><br>

        <button id="limpiar" type="button">Limpiar</button>
    </form>

    <p id="error"></p>
    <p id="resultado"></p>
    
</body>
</html>
